[package]
name = "glacier-texture"
version = "2.1.1"
edition = "2021"
license = "Apache-2.0"
categories = ["game-development", "data-structures", "parser-implementations"]
keywords = ["texture", "hitman", "glacier", "modding", "DirectX"]
description = "Read and write Glacier Texture files"
repository = "https://github.com/dafitius/glacierformats-rs"

[badges.maintenance]
status = "actively-developed"

[dependencies]
directxtex = "1.3.0"
binrw = "0.15.1"
bitfield-struct = "0.13.0"
lz4 = "1.28.1"
thiserror = "2.0.18"
serde = { version = "1.0.219", features = ["serde_derive"]}
rpkg-rs = { version = "1.4.0", optional = true }
png = "0.18.1"
image = { version = "0.25.10" , default-features = false, optional = true }
memmap2 = "0.9.10"
half = "2.7.1"

[dependencies.glacier-base]
path = "../glacier-base"
version = "0.2.0"
features = ["binrw"]

[dev-dependencies]
clap = { version = "4.5.23", features = ["derive"] }
image = { version = "0.25.8" ,features = ["tga", "dds", "exr"] }
anyhow = "1.0.99"
rstest = "0.26.1"

[features]
default = ["rpkg", "image"]
rpkg = ["dep:rpkg-rs"]
image = ["dep:image"]
unstable = []
