[package]
name = "glacier-base"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
categories = ["game-development", "data-structures", "parser-implementations"]
keywords = ["hitman", "fl007", "glacier", "modding"]
description = "A common utility crate for various Glacier related libraries"
repository = "https://github.com/dafitius/glacierformats-rs"

[dependencies]
nalgebra = "0.35.0"
binrw = { version = "0.15.1", optional = true}

thiserror = "2.0.18"
byteorder = "1.5.0"
extended-tea = "0.1.1"
crc32fast = "1.5.0"

[features]
default = []
binrw = ["dep:binrw"]